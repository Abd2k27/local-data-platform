[project]
name = "local-data-platform"
version = "0.1.0"
description = "A modern data stack (Airflow, dbt, PostgreSQL, Metabase) running locally with Docker Compose"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
