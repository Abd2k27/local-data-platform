version: 2

models:
  - name: stg_yellow_trips
    description: Renamed and typed yellow-taxi trips. No rows are filtered here.
    columns:
      - name: trip_id
        description: Surrogate key built from source file + row position.
        data_tests: [unique, not_null]
      - name: pickup_at
        data_tests: [not_null]
      - name: source_month
        data_tests: [not_null]

  - name: stg_taxi_zones
    description: TLC taxi zones.
    columns:
      - name: zone_id
        data_tests: [unique, not_null]
      - name: borough
        data_tests: [not_null]
